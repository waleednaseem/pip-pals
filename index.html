<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pip-pals-theme");
          if (t === "light") document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Planning — Plan, Track & Manage Your Finances</title>
    <meta name="description" content="Daily Planning helps you organize expenses, track income, plan trades and manage your family & group finances — all in one dark, easy-to-use dashboard." />
    <meta name="author" content="Daily Planning" />

    <meta property="og:title" content="Daily Planning — Plan, Track & Manage Your Finances" />
    <meta property="og:description" content="Organize expenses, track income, plan trades and manage family & group finances in one dark dashboard." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
